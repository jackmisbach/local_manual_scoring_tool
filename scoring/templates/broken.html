<!doctype html>
<html>
    <head>
        <title>Couldn't load sample / {{ broken.uuid }}</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                min-height: 100vh;
                background: #f8f9fa;
                color: #333;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .modal {
                background: white;
                border-radius: 8px;
                max-width: 540px;
                width: 100%;
                padding: 20px 24px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            }
            .modal h2 {
                font-size: 1.1em;
                color: #92400e;
                margin-bottom: 8px;
            }
            .modal .meta {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.85em;
                color: #555;
                margin-bottom: 8px;
            }
            .modal .error-text {
                background: #fef3c7;
                border: 1px solid #fbbf24;
                border-radius: 4px;
                padding: 10px 12px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.85em;
                color: #78350f;
                white-space: pre-wrap;
                word-break: break-word;
                margin-bottom: 16px;
            }
            .modal .actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            /* Shared palette (kept narrow: just primary + an outline variant). */
            :root {
                --btn-primary: #2563eb;
            }
            .modal button {
                padding: 8px 16px;
                border-radius: 6px;
                border: 1px solid #d1d5db;
                background: white;
                color: #1f2937;
                cursor: pointer;
                font-size: 0.9em;
                font-family: inherit;
                transition: filter 0.12s, opacity 0.12s, background 0.12s;
            }
            .modal button.primary {
                background: var(--btn-primary);
                border-color: var(--btn-primary);
                color: white;
            }
            .modal button.primary:not(:disabled):hover {
                filter: brightness(0.92);
            }
            .modal button:not(.primary):not(:disabled):hover {
                background: #f3f4f6;
            }
            .modal button:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }
        </style>
    </head>
    <body>
        <div class="modal" role="dialog" aria-modal="true">
            <h2>Couldn't load this sample</h2>
            <div class="meta">{{ broken.task_name or "?" }} ({{ broken.uuid }})</div>
            <div class="error-text">{{ broken.error }}</div>
            <div class="actions">
                <button type="button" onclick="exitToSummary()">Exit to summary</button>
                <button type="button" id="skip-btn" class="primary" onclick="skipBroken()">
                    Skip this sample
                </button>
            </div>
        </div>

        <script>
            const BROKEN = { uuid: {{ broken.uuid|tojson }}, error: {{ broken.error|tojson }} };

            function exitToSummary() {
                window.location.href = "/summary";
            }

            async function skipBroken() {
                const btn = document.getElementById("skip-btn");
                btn.disabled = true;
                btn.textContent = "Skipping...";
                try {
                    const resp = await fetch("/api/skip-broken", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(BROKEN),
                    });
                    const data = await resp.json();
                    if (data.success) {
                        window.location.href = "/";
                    } else if (data.done) {
                        window.location.href = "/summary";
                    } else if (data.reload) {
                        window.location.href = "/";
                    } else {
                        alert("Error: " + (data.error || "Unknown"));
                        btn.disabled = false;
                        btn.textContent = "Skip this sample";
                    }
                } catch (err) {
                    alert("Error: " + err.message);
                    btn.disabled = false;
                    btn.textContent = "Skip this sample";
                }
            }
        </script>
    </body>
</html>
