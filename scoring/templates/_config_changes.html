{% if config_changes %}
<div
    id="config-changes-banner"
    style="
        background: #ecfdf5;
        border: 1px solid #34d399;
        color: #065f46;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 0.9em;
        display: flex;
        align-items: flex-start;
        gap: 12px;
    "
>
    <div style="flex: 1;">
        <strong>Config updated:</strong>
        <ul style="margin: 6px 0 0 20px; padding: 0;">
            {% for change in config_changes %}<li>{{ change }}</li>{% endfor %}
        </ul>
        <p style="margin-top: 8px; font-size: 0.85em; color: #047857;">
            Edit <code>config.json</code> or run <code>manual-score config edit</code> to change.
        </p>
    </div>
    <button
        type="button"
        title="Dismiss"
        aria-label="Dismiss"
        onclick="document.getElementById('config-changes-banner').style.display='none'"
        style="
            background: transparent;
            color: inherit;
            border: none;
            padding: 2px 8px;
            font-size: 1.2em;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
        "
    >&times;</button>
</div>
{% endif %}
